name: Fix User Role

on:
  push:
    paths:
      - '.github/workflows/fix-user-role.yml'

jobs:
  fix-role:
    runs-on: ubuntu-latest
    steps:
      - name: Fix supatsorn role in Firestore
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/sa-key.json
          pip install firebase-admin -q
          python3 -c "
import firebase_admin
from firebase_admin import credentials, firestore, auth as fb_auth

cred = credentials.Certificate('/tmp/sa-key.json')
firebase_admin.initialize_app(cred)
db = firestore.client()

try:
    user = fb_auth.get_user_by_email('supatsorn5608@gmail.com')
    uid = user.uid
    print('Found UID:', uid)
    doc_ref = db.collection('users').document(uid)
    doc = doc_ref.get()
    if doc.exists:
        print('Current role:', doc.to_dict().get('role'))
        doc_ref.update({'role': 'cashier'})
        print('Updated to cashier')
    else:
        doc_ref.set({'uid': uid, 'email': 'supatsorn5608@gmail.com', 'role': 'cashier', 'createdAt': firestore.SERVER_TIMESTAMP})
        print('Created doc with cashier role')
    orphans = list(db.collection('users').where('email', '==', 'supatsorn5608@gmail.com').stream())
    for o in orphans:
        if o.id != uid:
            print('Orphan found:', o.id, 'role:', o.to_dict().get('role'))
            o.reference.update({'role': 'cashier'})
            print('Orphan updated')
except Exception as e:
    print('Error:', e)
    raise
"
