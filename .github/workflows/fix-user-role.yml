name: Fix User Role

on:
  push:
    paths:
      - '.github/workflows/fix-user-role.yml'

jobs:
  fix-role:
    runs-on: ubuntu-latest
    steps:
      - name: Fix supatsorn role in Firestore
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SCRIPT_B64: 
        run: |
          echo "$GCP_SA_KEY" > /tmp/sa-key.json
          echo "$SCRIPT_B64" | base64 -d > /tmp/fix_role.py
          pip install firebase-admin -q
          python3 /tmp/fix_role.py
