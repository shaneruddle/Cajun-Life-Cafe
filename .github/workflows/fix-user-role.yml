name: Fix User Role

on:
  workflow_dispatch:

jobs:
  fix-role:
    runs-on: ubuntu-latest
    steps:
      - name: Fix supatsorn role in Firestore
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/sa-key.json
          pip install firebase-admin -q
          python3 << 'PYEOF'
import json, firebase_admin
from firebase_admin import credentials, firestore, auth

cred = credentials.Certificate('/tmp/sa-key.json')
firebase_admin.initialize_app(cred)

db = firestore.client()
fa = auth.Client(firebase_admin.get_app())

# Find the user by email
try:
    user = fa.get_user_by_email('supatsorn5608@gmail.com')
    uid = user.uid
    print(f"Found UID: {uid}")
    
    # Check existing doc
    doc_ref = db.collection('users').document(uid)
    doc = doc_ref.get()
    
    if doc.exists:
        data = doc.to_dict()
        print(f"Existing role: {data.get('role')}")
        doc_ref.update({'role': 'cashier'})
        print("Updated role to cashier")
    else:
        print("Doc does not exist, creating...")
        doc_ref.set({
            'uid': uid,
            'email': 'supatsorn5608@gmail.com',
            'role': 'cashier',
            'createdAt': firestore.SERVER_TIMESTAMP,
            'lastLogin': firestore.SERVER_TIMESTAMP
        })
        print("Created doc with cashier role")
    
    # Also check for orphan docs by email
    orphans = db.collection('users').where('email', '==', 'supatsorn5608@gmail.com').stream()
    for o in orphans:
        if o.id != uid:
            print(f"Found orphan doc: {o.id} with role: {o.to_dict().get('role')}")
            # Update orphan too just in case
            o.reference.update({'role': 'cashier'})
            print(f"Updated orphan doc role to cashier")
            
except Exception as e:
    print(f"Error: {e}")
PYEOF
