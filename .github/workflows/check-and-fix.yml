name: Check and Fix Mina

on:
  push:
    paths:
      - '.github/workflows/check-and-fix.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose and fix
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SCRIPT: 
        run: |
          echo "$GCP_SA_KEY" > /tmp/sa-key.json
          echo "$SCRIPT" | base64 -d > /tmp/diagnose2.py
          pip install firebase-admin -q
          python3 /tmp/diagnose2.py
