name: Check and Fix Mina

on:
  push:
    paths:
      - '.github/workflows/check-and-fix.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose and fix
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/sa-key.json
          pip install firebase-admin -q
          python3 -c "
import firebase_admin
from firebase_admin import credentials, firestore, auth as fb_auth

cred = credentials.Certificate('/tmp/sa-key.json')
firebase_admin.initialize_app(cred)
db = firestore.client()

print('=== ALL Firestore users docs ===')
for d in db.collection('users').stream():
    data = d.to_dict()
    print(f'  doc_id={d.id} | email={data.get(\"email\")} | role={data.get(\"role\")} | name={data.get(\"displayName\")}')

print()
print('=== ALL Firebase Auth accounts ===')
all_auth = list(fb_auth.list_users().users)
for u in all_auth:
    doc = db.collection('users').document(u.uid).get()
    role = doc.to_dict().get('role') if doc.exists else 'NO FIRESTORE DOC'
    print(f'  email={u.email} | uid={u.uid} | firestore_role={role}')

print()
print('=== FIXING: ensure every Auth UID has a matching Firestore doc ===')
for u in all_auth:
    if u.email == 'info@cajunlifecafe.com':
        continue
    doc_ref = db.collection('users').document(u.uid)
    doc = doc_ref.get()
    if not doc.exists:
        # Find any doc with this email
        matches = list(db.collection('users').where('email', '==', u.email).stream())
        role = matches[0].to_dict().get('role', 'employee') if matches else 'employee'
        print(f'  CREATING doc for {u.email} uid={u.uid} with role={role}')
        doc_ref.set({'uid': u.uid, 'email': u.email, 'displayName': u.display_name or '', 'role': role, 'createdAt': firestore.SERVER_TIMESTAMP})
    else:
        print(f'  OK: {u.email} uid={u.uid} role={doc.to_dict().get(\"role\")}')
print('Done.')
"
