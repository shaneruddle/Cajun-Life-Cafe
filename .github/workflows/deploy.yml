name: Deploy Cajun Life Cafe

  on:
  push:
    branches:
      - main

        jobs:
  deploy:
    name: Build & Deploy
          runs-on: ubuntu-latest

                steps:
      - name: Checkout
                uses: actions/checkout@v4

                        - name: Setup Node.js
                                  uses: actions/setup-node@v4
                                            with:
                                              node-version: '20'
                                              cache: 'npm'

                                                      - name: Install dependencies
                                                                run: npm ci

                                                                        - name: Build frontend
                                                                                  run: npm run build

                                                                                          - name: Authenticate to Google Cloud
                                                                                                    uses: google-github-actions/auth@v2
                                                                                                              with:
                                                                                                                credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
                uses: google-github-actions/setup-gcloud@v2

                        - name: Configure Docker for GCR
                                  run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

                                - name: Build & push Docker image
                                          run: |
                                                      IMAGE=asia-east1-docker.pkg.dev/cajun-life-cafe/cajun-life-cafe/server:${{ github.sha }}
          docker build -t $IMAGE .
                      docker push $IMAGE

                  - name: Deploy to Cloud Run
                            run: |
                                        IMAGE=asia-east1-docker.pkg.dev/cajun-life-cafe/cajun-life-cafe/server:${{ github.sha }}
          gcloud run deploy cajun-life-cafe-server \
                        --image $IMAGE \
                        --region asia-east1 \
                        --platform managed \
                        --allow-unauthenticated \
                        --set-secrets="GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,NODEMAILER_USER=NODEMAILER_USER:latest,NODEMAILER_PASS=NODEMAILER_PASS:latest" \
                        --project cajun-life-cafe

                  - name: Deploy to Firebase Hosting
                            uses: FirebaseExtended/action-hosting-deploy@v0
                                      with:
                                        repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          channelId: live
                      projectId: cajun-life-cafe
