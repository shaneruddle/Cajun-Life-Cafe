name: Deploy Cajun Life Cafe

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project cajun-life-cafe --non-interactive

  deploy-server:
    name: Build & Deploy OCR Server to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t asia-east1-docker.pkg.dev/cajun-life-cafe/cajun-life-cafe/server:${{ github.sha }} .
          docker tag asia-east1-docker.pkg.dev/cajun-life-cafe/cajun-life-cafe/server:${{ github.sha }} asia-east1-docker.pkg.dev/cajun-life-cafe/cajun-life-cafe/server:latest

      - name: Push Docker image
        run: |
          docker push asia-east1-docker.pkg.dev/cajun-life-cafe/cajun-life-cafe/server:${{ github.sha }}
          docker push asia-east1-docker.pkg.dev/cajun-life-cafe/cajun-life-cafe/server:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy cajun-life-cafe-server \
            --image asia-east1-docker.pkg.dev/cajun-life-cafe/cajun-life-cafe/server:${{ github.sha }} \
            --region asia-east1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars CLOUD_VISION_API_KEY=${{ secrets.CLOUD_VISION_API_KEY }} \
            --project cajun-life-cafe \
            --quiet
