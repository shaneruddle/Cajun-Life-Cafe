name: Read Results

on:
  push:
    paths:
      - '.github/workflows/read-results.yml'

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read diagnosis
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SCRIPT: 
        run: |
          echo "$GCP_SA_KEY" > /tmp/sa-key.json
          echo "$SCRIPT" | base64 -d > /tmp/read_results.py
          pip install firebase-admin -q
          python3 /tmp/read_results.py
